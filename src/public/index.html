  <div class="app" id="app">

        <div>

          <small id="siteSubtitle">PSE Energy Monitor</small>
        </div>
      </div>
      <div class="side-search"><input type="search" id="navSearch" placeholder="Search plant / line"></div>

        <div class="who"><b id="whoName">-</b><small id="whoRole">-</small></div>

        <button class="gbtn" id="logoutBtn" title="Sign out"><svg class="icon"><use href="#i-logout"/></svg></button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="gbtn" id="menuBtn" title="Menu"><svg class="icon"><use href="#i-menu"/></svg></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="sum-chips" id="sumChips"></div>
        <div class="row" style="gap:.5rem">
          <div class="live-dot" id="liveDot" title="realtime"></div>
          <div class="clock" id="clock">--:--:--</div>

      <main id="view"><div class="content"><div class="empty">Loading...</div></div></main>
